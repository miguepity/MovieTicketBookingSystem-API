services:
  postgres:
    image: postgres:15-alpine
    container_name: movieBookingTicketDbGroup2
    restart: always
    environment:
      POSTGRES_USER: MovieTicketBookingSystem_Group2
      POSTGRES_PASSWORD: password
      POSTGRES_DB: MovieTicketBookingSystem_dbGroup2
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_network
networks:
  backend_network:
    driver: bridge
volumes:
  postgres_data:
